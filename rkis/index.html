<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека - Вход в систему</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-left">
            <div class="login-content">
                <h1 class="library-title">📚 BiblioTech</h1>
                <p class="library-subtitle">Современная библиотечная система</p>
                
                <div class="features-list">
                    <div class="feature-item">
                        <span class="feature-icon">📖</span>
                        <span>Электронный каталог</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">👥</span>
                        <span>Управление читателями</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🔄</span>
                        <span>Автоматизация выдачи</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="login-right">
            <div class="login-form-container">
                <h2>Добро пожаловать!</h2>
                <p class="login-subtitle">Войдите в систему</p>
                
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Введите ваш email" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" id="password" placeholder="Введите пароль" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Тип пользователя</label>
                        <select id="userType" required>
                            <option value="user">Читатель</option>
                            <option value="admin">Администратор</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="login-btn">Войти</button>
                </form>
                
                <div class="demo-accounts">
                    <p>Демо-аккаунты:</p>
                    <div class="demo-account-item">
                        <span>Админ: admin@library.ru / admin123</span>
                    </div>
                    <div class="demo-account-item">
                        <span>Читатель: user@library.ru / user123</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
